info:
  name: Reset Password
  type: http
  seq: 3

http:
  method: POST
  url: "{{local}}/auth/v1/password/reset"
  body:
    type: json
    data: |-
      {
        "resetToken": "YOUR_TEMPORARY_RESET_TOKEN_HERE",
        "newPassword": "newpassword123"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
