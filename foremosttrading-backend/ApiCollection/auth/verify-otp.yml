info:
  name: Verify OTP
  type: http
  seq: 2

http:
  method: POST
  url: "{{local}}/auth/v1/password/verify-otp"
  body:
    type: json
    data: |-
      {
        "identifier": "testuser@example.com",
        "otp": "123456"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
