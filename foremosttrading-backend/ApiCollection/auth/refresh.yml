info:
  name: refresh
  type: http
  seq: 4

http:
  method: POST
  url: "{{local}}/auth/v1/refresh"
  body:
    type: json
    data: |-
      {
        "refreshToken":"your-refresh-token-here"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
