info:
  name: Add Item to Cart
  type: http
  seq: 2

http:
  method: POST
  url: "{{local}}/cart/items"
  headers:
    - name: x-session-id
      value: guest-session-123
  body:
    type: json
    data: |-
      {
        "productId": "SOME-UUID-HERE",
        "quantity": 1
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
