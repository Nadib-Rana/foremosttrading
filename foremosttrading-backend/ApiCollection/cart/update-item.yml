info:
  name: Update Item Quantity
  type: http
  seq: 3

http:
  method: PUT
  url: "{{local}}/cart/items/ITEM-ID-HERE"
  headers:
    - name: x-session-id
      value: guest-session-123
  body:
    type: json
    data: |-
      {
        "quantity": 2
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
